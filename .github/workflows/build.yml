name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate device profiles
        shell: pwsh
        run: ./tools/validate-devices.ps1

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        shell: pwsh
        run: |
          dotnet --info
          dotnet restore MoonDropEQ.csproj 2>&1 | Tee-Object -FilePath restore.log
          exit $LASTEXITCODE

      - name: Surface restore errors
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path restore.log) {
            Get-Content restore.log -Tail 40 | ForEach-Object { Write-Host "::error::$_" }
          } else {
            Write-Host "::error::restore.log not found"
          }
          exit 1

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish MoonDropEQ.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish 2>&1 | Tee-Object -FilePath publish.log
          exit $LASTEXITCODE

      - name: Surface publish errors
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path publish.log) {
            Get-Content publish.log -Tail 40 | ForEach-Object { Write-Host "::error::$_" }
          } else {
            Write-Host "::error::publish.log not found"
          }
          exit 1

      - name: Package
        run: Compress-Archive -Path publish/* -DestinationPath MoonDropEQ-win-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoonDropEQ-win-x64
          path: MoonDropEQ-win-x64.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: MoonDropEQ-win-x64.zip
          generate_release_notes: true
