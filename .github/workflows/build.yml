name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore MoonDropEQ.csproj

      - name: Publish
        run: dotnet publish MoonDropEQ.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish

      - name: Package
        run: Compress-Archive -Path publish/* -DestinationPath MoonDropEQ-win-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoonDropEQ-win-x64
          path: MoonDropEQ-win-x64.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: MoonDropEQ-win-x64.zip
